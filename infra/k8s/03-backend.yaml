apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: marketpulse
  labels:
    app.kubernetes.io/name: marketpulse
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marketpulse
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketpulse
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: backend
          image: leebyonghoon/marketpulse-backend:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: marketpulse-config
            - secretRef:
                name: marketpulse-secrets
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: marketpulse
  labels:
    app.kubernetes.io/name: marketpulse
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: marketpulse
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
