apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: marketpulse
  labels:
    app.kubernetes.io/name: marketpulse
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: marketpulse-backend
        metrics_path: /metrics
        static_configs:
          - targets:
              - backend.marketpulse.svc.cluster.local:8000
            labels:
              app: marketpulse
              component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: marketpulse
  labels:
    app.kubernetes.io/name: marketpulse
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marketpulse
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketpulse
        app.kubernetes.io/component: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: marketpulse
  labels:
    app.kubernetes.io/name: marketpulse
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: marketpulse
    app.kubernetes.io/component: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: marketpulse
  labels:
    app.kubernetes.io/name: marketpulse
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: MarketPulse Prometheus
        type: prometheus
        uid: marketpulse-prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: MarketPulse
        orgId: 1
        folder: MarketPulse
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/dashboards
---
