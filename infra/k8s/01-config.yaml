apiVersion: v1
kind: ConfigMap
metadata:
  name: marketpulse-config
  namespace: marketpulse
  labels:
    app.kubernetes.io/name: marketpulse
data:
  MARKETPULSE_ENV: production
  POSTGRES_DB: marketpulse
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
---
apiVersion: v1
kind: Secret
metadata:
  name: marketpulse-secrets
  namespace: marketpulse
  labels:
    app.kubernetes.io/name: marketpulse
type: Opaque
stringData:
  DATABASE_URL: postgresql://marketpulse:replace-me@postgres:5432/marketpulse
  MARKETPULSE_SECRET_PLACEHOLDER: replace-me
  POSTGRES_PASSWORD: replace-me
  POSTGRES_USER: marketpulse
