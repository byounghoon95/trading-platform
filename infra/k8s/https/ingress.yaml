apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketpulse
  namespace: marketpulse
  labels:
    app.kubernetes.io/name: marketpulse
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - marketpulse.example.com
      secretName: marketpulse-tls
  rules:
    - host: marketpulse.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
