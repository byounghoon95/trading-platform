{{- if .Values.secrets.create }}
{{- if or (not .Values.secrets.postgresPassword) (not .Values.secrets.databaseUrl) }}
{{- fail "secrets.postgresPassword and secrets.databaseUrl are required when secrets.create=true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "marketpulse.secretName" . }}
  namespace: {{ include "marketpulse.namespace" . }}
  labels:
    {{- include "marketpulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
{{- end }}
