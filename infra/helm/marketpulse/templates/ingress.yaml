{{- if .Values.ingress.enabled }}
{{- $annotations := deepCopy .Values.ingress.annotations }}
{{- if .Values.ingress.tls.enabled }}
{{- $_ := set $annotations "cert-manager.io/cluster-issuer" .Values.certManager.issuer.name }}
{{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.entrypoints" "web,websecure" }}
{{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.tls" "true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketpulse
  namespace: {{ include "marketpulse.namespace" . }}
  labels:
    {{- include "marketpulse.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- toYaml .Values.ingress.tls.hosts | nindent 8 }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
{{- end }}
