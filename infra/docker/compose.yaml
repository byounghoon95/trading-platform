name: marketpulse

services:
  frontend:
    image: node:20-alpine
    command:
      - sh
      - -c
      - echo 'MarketPulse frontend placeholder; Dockerfile lands in infra TASK-02.' && sleep infinity
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    image: python:3.12-slim
    command:
      - sh
      - -c
      - echo 'MarketPulse backend placeholder; Dockerfile lands in infra TASK-02.' && sleep infinity
    environment:
      MARKETPULSE_ENV: local
      DATABASE_URL: postgresql://marketpulse:marketpulse@postgres:5432/marketpulse
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketpulse
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: marketpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
