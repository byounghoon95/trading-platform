name: marketpulse

services:
  frontend:
    image: node:20-alpine
    command:
      - sh
      - -c
      - echo 'MarketPulse frontend placeholder; Dockerfile lands in infra TASK-02.' && sleep infinity
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    image: python:3.12-slim
    command:
      - sh
      - -c
      - echo 'MarketPulse backend placeholder; Dockerfile lands in infra TASK-02.' && sleep infinity
    environment:
      MARKETPULSE_ENV: local
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
