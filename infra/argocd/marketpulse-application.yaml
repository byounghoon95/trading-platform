apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketpulse
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/byounghoon95/trading-platform.git
    targetRevision: main
    path: infra/helm/marketpulse
    helm:
      releaseName: marketpulse
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: marketpulse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
