<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">MarketPulse deployment architecture</title>
  <desc id="desc">GitHub Actions builds immutable Docker images, updates Helm values, Argo CD syncs the Helm chart to k3s, and Traefik routes users to the frontend, backend, metrics, and monitoring stack.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .cluster { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .ops { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .store { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .external { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; rx: 10; }
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 18px Arial, sans-serif; fill: #1e293b; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .tiny { font: 12px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .gitops { stroke: #7c3aed; stroke-width: 2.5; fill: none; marker-end: url(#arrow-purple); stroke-dasharray: 7 5; }
      .data { stroke: #0f766e; stroke-width: 2.5; fill: none; marker-end: url(#arrow-teal); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="820" />
  <text class="title" x="48" y="52">MarketPulse Current Architecture</text>
  <text class="small" x="48" y="80">Deployment focus: GitHub Actions builds images, Git updates desired state, Argo CD syncs Helm into k3s.</text>

  <rect class="panel" x="48" y="120" width="1160" height="132" />
  <text class="section" x="72" y="154">CI/CD and GitOps handoff</text>

  <rect class="panel" x="72" y="176" width="145" height="48" />
  <text class="label" x="100" y="198">PR merge</text>
  <text class="tiny" x="96" y="216">main branch</text>

  <rect class="panel" x="260" y="176" width="160" height="48" />
  <text class="label" x="284" y="198">GitHub Actions</text>
  <text class="tiny" x="296" y="216">test, build, deploy</text>

  <rect class="panel" x="462" y="176" width="148" height="48" />
  <text class="label" x="491" y="198">Docker Hub</text>
  <text class="tiny" x="492" y="216">sha-* image tags</text>

  <rect class="panel" x="652" y="176" width="168" height="48" />
  <text class="label" x="680" y="198">Helm values</text>
  <text class="tiny" x="681" y="216">desired image tags</text>

  <rect class="panel" x="862" y="176" width="132" height="48" />
  <text class="label" x="895" y="198">Argo CD</text>
  <text class="tiny" x="892" y="216">sync + selfHeal</text>

  <rect class="panel" x="1036" y="176" width="148" height="48" />
  <text class="label" x="1084" y="198">k3s</text>
  <text class="tiny" x="1069" y="216">Helm release</text>

  <path class="arrow" d="M217 200 H260" />
  <path class="arrow" d="M420 200 H462" />
  <path class="arrow" d="M610 200 H652" />
  <path class="gitops" d="M820 200 H862" />
  <path class="gitops" d="M994 200 H1036" />

  <rect class="cluster" x="48" y="292" width="1160" height="440" />
  <text class="section" x="72" y="326">k3s namespace: marketpulse</text>

  <rect class="external" x="72" y="368" width="150" height="64" />
  <text class="label" x="113" y="394">Browser</text>
  <text class="tiny" x="97" y="414">marketpulse.byhoon.co.kr</text>

  <rect class="panel" x="278" y="356" width="176" height="88" />
  <text class="label" x="324" y="386">Traefik</text>
  <text class="tiny" x="307" y="407">Ingress routing</text>
  <text class="tiny" x="307" y="424">web / websecure</text>

  <rect class="ops" x="278" y="488" width="176" height="72" />
  <text class="label" x="305" y="516">cert-manager</text>
  <text class="tiny" x="305" y="537">Let's Encrypt TLS</text>

  <rect class="panel" x="520" y="340" width="170" height="72" />
  <text class="label" x="561" y="368">Frontend</text>
  <text class="tiny" x="552" y="389">nginx + React/Vite</text>

  <rect class="panel" x="520" y="470" width="170" height="78" />
  <text class="label" x="566" y="498">Backend</text>
  <text class="tiny" x="558" y="519">FastAPI API</text>
  <text class="tiny" x="552" y="536">/api, /metrics</text>

  <rect class="store" x="754" y="336" width="170" height="70" />
  <text class="label" x="794" y="364">PostgreSQL</text>
  <text class="tiny" x="784" y="385">market data store</text>

  <rect class="external" x="754" y="576" width="170" height="70" />
  <text class="label" x="795" y="604">Binance API</text>
  <text class="tiny" x="789" y="625">public market data</text>

  <rect class="ops" x="986" y="382" width="168" height="76" />
  <text class="label" x="1027" y="410">Prometheus</text>
  <text class="tiny" x="1022" y="431">scrapes /metrics</text>

  <rect class="ops" x="986" y="510" width="168" height="76" />
  <text class="label" x="1038" y="538">Grafana</text>
  <text class="tiny" x="1022" y="559">operations dashboard</text>

  <path class="arrow" d="M222 400 H278" />
  <path class="arrow" d="M454 376 H520" />
  <path class="arrow" d="M454 510 H520" />
  <path class="data" d="M605 412 V470" />
  <path class="data" d="M690 509 H754" />
  <path class="data" d="M690 548 C720 610,725 611,754 611" />
  <path class="arrow" d="M1070 458 V510" />
  <path class="data" d="M690 509 C825 509,825 420,986 420" />
  <path class="arrow" d="M366 444 V488" />

  <rect class="panel" x="72" y="668" width="1084" height="38" />
  <text class="small" x="96" y="692">Boundary: GitHub Actions changes Git state; Argo CD applies cluster state. Runtime traffic stays behind Traefik ingress.</text>
</svg>
