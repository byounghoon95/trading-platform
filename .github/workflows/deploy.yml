name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable Docker image tag to deploy, for example sha-c24ef53. Defaults to this workflow commit."
        required: false
        type: string
  workflow_run:
    workflows:
      - Images
    branches:
      - main
    types:
      - completed

concurrency:
  group: deploy-marketpulse-gitops
  cancel-in-progress: false

permissions:
  contents: write

env:
  VALUES_FILE: infra/helm/marketpulse/values.yaml

jobs:
  handoff:
    name: Update GitOps image tags
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve image tag
        id: image-tag
        env:
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ -n "${MANUAL_IMAGE_TAG}" ]]; then
            image_tag="${MANUAL_IMAGE_TAG}"
          else
            image_tag="sha-${SOURCE_SHA:0:7}"
          fi

          if [[ ! "${image_tag}" =~ ^sha-[0-9a-fA-F]{7,40}$ ]]; then
            echo "Image tag must be an immutable sha-* tag." >&2
            exit 1
          fi

          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Update Helm values image tags
        uses: mikefarah/yq@v4.44.3
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        with:
          cmd: yq -i '.backend.image.tag = strenv(IMAGE_TAG) | .frontend.image.tag = strenv(IMAGE_TAG)' "${{ env.VALUES_FILE }}"

      - name: Commit GitOps image tags
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "${VALUES_FILE}"; then
            echo "Helm image tags already set to ${IMAGE_TAG}; nothing to commit."
            exit 0
          fi

          git add "${VALUES_FILE}"
          git commit -m "infra(infra): update marketpulse image tag"
          git push origin HEAD:main
